<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CarlOS — Terminal en vivo</title>
<style>
  :root{
    --bg:#0c0a0b; --term-bg:#121013; --ink:#d8d0cc; --dim:#635a5c;
    --ruby:#e23a56; --ruby-dk:#7a1520; --ruby-lt:#f2a9b5; --line:#2a2325;
    --green:#5fff5f; --amber:#c98a3b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    font-family:'DejaVu Sans Mono','Courier New',monospace; padding:20px;
  }
  .frame{ width:100%; max-width:820px; }
  .titlebar{
    background:#171314; border:1px solid var(--line); border-bottom:none;
    border-radius:8px 8px 0 0; padding:9px 14px; display:flex; align-items:center; gap:7px;
  }
  .dot{ width:9px;height:9px;border-radius:50%;background:var(--line); }
  .titlebar .name{ margin-left:8px; color:var(--dim); font-size:.74rem; }
  .term{
    background:var(--term-bg); border:1px solid var(--line); border-top:none;
    border-radius:0 0 8px 8px; height:520px; overflow-y:auto;
    padding:14px 16px; font-size:.86rem; line-height:1.45; color:var(--ink);
    white-space:pre-wrap; word-break:break-word;
  }
  .term::-webkit-scrollbar{width:8px;}
  .term::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  .prompt-line{ display:flex; }
  .prompt{ color:var(--ruby); margin-right:6px; flex:none; }
  .cmdin{
    background:transparent; border:none; outline:none; color:var(--ink);
    font-family:inherit; font-size:inherit; flex:1; caret-color:var(--ruby);
  }
  .hint{ text-align:center; color:var(--dim); font-size:.72rem; margin-top:12px; }
  .r{color:var(--ruby);} .rd{color:var(--ruby-dk);} .rl{color:var(--ruby-lt);}
  .g{color:var(--green);} .a{color:var(--amber);} .d{color:var(--dim);} .w{color:#fff;}
</style>
</head>
<body>
<div class="frame">
  <div class="titlebar">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <span class="name">/dev/tty0 — CarlOS 0.2 (demo web)</span>
  </div>
  <div class="term" id="term"></div>
  <div class="hint">terminal simulada · escribe <b>help</b> · no es el sistema real, es una demo</div>
</div>

<script>
const term = document.getElementById('term');

// ---- utilidades de color (a spans) ----
const C = {
  r: s => `<span class="r">${s}</span>`,
  rd: s => `<span class="rd">${s}</span>`,
  rl: s => `<span class="rl">${s}</span>`,
  g: s => `<span class="g">${s}</span>`,
  a: s => `<span class="a">${s}</span>`,
  d: s => `<span class="d">${s}</span>`,
  w: s => `<span class="w">${s}</span>`,
};

// ---- la gema Ruby coloreada (como logo-ruby.txt) ----
function rubyGem() {
  const gem = [
    "          ****** ==   ",
    "      ************####-",
    "    ***************####",
    "   *********** *****###",
    " =********-***######## ",
    " ======*******######*  ",
    "##====####****#####*   ",
    "###==########*####**   ",
    " ##=########==####*    ",
    "     -####======##     ",
    "             ##==*     "
  ];
  return gem.map(line =>
    [...line].map(ch =>
      ch === '*' ? C.r(ch) :
      ch === '#' ? C.rd(ch) :
      ch === '=' ? C.rl(ch) :
      ch === '-' ? C.rd(ch) : ch
    ).join('')
  ).join('\n');
}

// ---- comandos simulados ----
const COMMANDS = {
  help: () => [
    `${C.r('== ')}${C.w('SISTEMA')}${C.r(' ==')}`,
    `  scfetch      ${C.d('info + logo')}    carlosinfo   ${C.d('info detallada')}`,
    `  version      ${C.d('version')}        hardware     ${C.d('info hardware')}`,
    ``,
    `${C.r('== ')}${C.w('ESCRITORIO')}${C.r(' ==')}`,
    `  startc       ${C.d('escritorio EGT (ventanas + mouse + terminal)')}`,
    ``,
    `${C.r('== ')}${C.w('JUEGO Y AUDIO')}${C.r(' ==')}`,
    `  moskau       ${C.d('Tetris con musica    moskau -m  mono limpio')}`,
    `  buztts       ${C.d('voz por buzzer + subtitulos')}`,
    ``,
    `${C.r('== ')}${C.w('SECRETO')}${C.r(' ==')}`,
    `  ${C.d('(hay un comando escondido... suerte)')}`,
    ``,
    `${C.d('comandos: scfetch startc moskau buztts version carlosinfo about clear')}`,
  ].join('\n'),

  scfetch: () => {
    const gem = rubyGem().split('\n');
    const info = [
      ``, ``,
      `${C.w('OS')}        : CarlOS 0.2 Alpha`,
      `${C.w('Codename')}  : ${C.r('Ruby of Sistem')}`,
      `${C.w('Kernel')}    : 7.1.0`,
      `${C.w('Shell')}     : BusyBox ash`,
      `${C.w('WM')}        : EGT (Ruby)`,
      `${C.w('CPU')}       : depende de tu maquina`,
      `${C.w('Memory')}    : lo que tengas`,
      ``,
      `${C.rd('SC Co. - Union of SCWEBS & SCSOFTWARE')}`,
    ];
    let out = '';
    const maxg = gem.length;
    const rows = Math.max(maxg, info.length);
    for (let i = 0; i < rows; i++) {
      const g = gem[i] || ' '.repeat(22);
      const inf = info[i] || '';
      out += g + '   ' + inf + '\n';
    }
    return out;
  },

  startc: () => [
    C.d('iniciando entorno grafico EGT...'),
    '',
    C.r('┌──────────────────────────────────────────────┐'),
    C.r('│') + '  ' + C.w('CarlOS ') + C.r('◆') + C.w(' Ruby of Sistem') + '                   ' + C.r('│'),
    C.r('│') + '                                              ' + C.r('│'),
    C.r('│') + '  ' + C.d('[ Bienvenida ]') + '                              ' + C.r('│'),
    C.r('│') + '  ' + C.w('Bienvenido a CarlOS 0.2') + '                     ' + C.r('│'),
    C.r('│') + '  ' + C.d('1-6 apps  TAB cambia  flechas mueve') + '         ' + C.r('│'),
    C.r('│') + '  ' + C.d('c cierra  q sale') + '   ' + C.g('◄ mouse') + '                  ' + C.r('│'),
    C.r('└──────────────────────────────────────────────┘'),
    '',
    C.d('(en el sistema real: ventanas apilables, mouse por'),
    C.d(' /dev/input/mice, y una terminal ash funcional dentro)'),
    C.a('el EGT completo solo corre en CarlOS de verdad :)'),
  ].join('\n'),

  moskau: () => [
    C.d('cargando moskau (Tetris)...'),
    '',
    C.r('┌────────────────────┐') + '   ' + C.r('┌ INFO ────────┐'),
    C.r('│') + C.d('· · · · · · · · · ·') + C.r('│') + '   ' + C.r('│') + C.w(' Puntos: 0    ') + C.r('│'),
    C.r('│') + C.d('· · ') + C.r('██') + C.d('· · · · · ·') + C.r('│') + '   ' + C.r('│') + C.w(' Lineas: 0    ') + C.r('│'),
    C.r('│') + C.d('· · ') + C.r('██') + C.g('████') + C.d('· · ·') + C.r('│') + '   ' + C.r('│') + C.w(' Nivel:  1    ') + C.r('│'),
    C.r('│') + C.a('████') + C.d('· ') + '<span style="color:#0af">██</span>' + C.d('· · · ·') + C.r('│') + '   ' + C.r('└──────────────┘'),
    C.r('│') + '<span style="color:#f0f">████</span>' + C.d('· · · · · · ·') + C.r('│'),
    C.r('└────────────────────┘'),
    '',
    C.d('musica Korobeiniki por el buzzer 🎵'),
    C.a('si apilas mal, la musica se BURLA de ti 😏'),
    C.d('(el juego real corre en CarlOS con audio y todo)'),
  ].join('\n'),

  buztts: (args) => {
    const txt = args.join(' ') || 'Bienvenido a CarlOS';
    return [
      C.d('bip bip biiip bip-bip biiip...  (por el buzzer)'),
      '',
      `<span style="background:#2a2325;color:#fff"> RuTux ${C.r('>')} ${txt} </span>`,
      '',
      C.d('(no se entiende nada, POR ESO los subtitulos 🤖)'),
    ].join('\n');
  },

  version: () => `CarlOS 0.2 Alpha ${C.r('"Ruby of Sistem"')}\nkernel 7.1.0 · BusyBox ash · EGT en Ruby`,

  carlosinfo: () => COMMANDS.scfetch(),

  about: () => [
    C.r('CarlOS') + ' — sistema operativo hecho a mano',
    '',
    C.d('Nacio de 6 dias a casi 50°C con un ventilador'),
    C.d('en la cara. Kernel Linux + BusyBox + userland propio.'),
    C.d('Entorno grafico de texto (EGT) en Ruby puro.'),
    '',
    C.w('web') + ': carlos-oss.web.app',
    C.w('SC Co.') + ' - Union of SCWEBS & SCSOFTWARE',
  ].join('\n'),

  skriet: () => [
    C.rd('...тишина.  (silencio)'),
    C.d('El secreto duerme hasta que la red despierte.'),
    C.d('(en el sistema real, con internet, esto lanza Bad Apple 🍎)'),
  ].join('\n'),

  clear: () => { term.innerHTML = ''; return null; },

  ls: () => [
    C.r('bin  '), C.r('etc  '), C.r('opt  '), C.r('usr  '),
    C.d('dev  proc  sys  tmp')
  ].join(''),

  whoami: () => 'carlos',
  uname: () => 'CarlOS 7.1.0 x86_64',
  pwd: () => '/root',
};

const ALIASES = { 'moskau -m':'moskau', 'sc':'scfetch' };

function print(html) {
  const div = document.createElement('div');
  div.innerHTML = html;
  term.appendChild(div);
  term.scrollTop = term.scrollHeight;
}

function runCommand(raw) {
  const input = raw.trim();
  print(`<span class="prompt-line"><span class="prompt">~ #</span>${escapeHtml(input)}</span>`);
  if (!input) { newPrompt(); return; }
  const parts = input.split(/\s+/);
  let cmd = parts[0];
  const args = parts.slice(1);
  // aliases simples
  if (cmd === 'moskau' && args[0] === '-m') { /* mismo */ }
  const fn = COMMANDS[cmd];
  if (fn) {
    const out = fn(args);
    if (out !== null) print(out);
  } else {
    print(`${C.d('ash:')} ${escapeHtml(cmd)}: ${C.d('command not found')}  ${C.d('(prueba: help)')}`);
  }
  newPrompt();
}

function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

let history = [], histIdx = -1;

function newPrompt() {
  const line = document.createElement('div');
  line.className = 'prompt-line';
  line.innerHTML = `<span class="prompt">~ #</span>`;
  const inp = document.createElement('input');
  inp.className = 'cmdin'; inp.autofocus = true; inp.spellcheck = false;
  line.appendChild(inp);
  term.appendChild(line);
  inp.focus();
  term.scrollTop = term.scrollHeight;

  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const val = inp.value;
      history.unshift(val); histIdx = -1;
      inp.disabled = true;
      inp.classList.remove('cmdin');
      // reemplazar el input por texto plano y quitar el prompt duplicado
      line.remove();
      runCommand(val);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (histIdx < history.length-1) { histIdx++; inp.value = history[histIdx] || ''; }
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (histIdx > 0) { histIdx--; inp.value = history[histIdx] || ''; }
      else { histIdx = -1; inp.value = ''; }
    }
  });
}

// mantener foco al hacer click en cualquier lado de la terminal
term.addEventListener('click', () => {
  const inp = term.querySelector('.cmdin');
  if (inp) inp.focus();
});

// ---- boot inicial ----
print(rubyGem());
print('');
print(`${C.w('CarlOS 0.2 Alpha')} ${C.r('"Ruby of Sistem"')}`);
print(C.d('BusyBox ash — demo web (no es el sistema real)'));
print(C.d("escribe 'help' para ver los comandos"));
print('');
newPrompt();
</script>
</body>
</html>
